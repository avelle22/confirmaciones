<!doctype html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">
    <title>Confirmación de Asistencia</title> <!-- Título que se muestra en la pestaña del navegador -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"> <!-- Incluye el framework Bootstrap para estilos y layouts -->
    
    <!-- FANCYAPPS - https://fancyapps.com/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.css"> <!-- Librería FancyApps para galerías modales (popup) -->
    
    <!-- AOS ANIMATE - https://michalsnik.github.io/aos/ -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" /> <!-- Librería AOS para animaciones al hacer scroll -->

    <!-- LINK LOCALES -->
    <link rel="stylesheet" href="style.css"> 
    
<!-- CONSULTA DEL PASE -->
<section class="consulta">
  <div class="contenido">
    <div data-aos="fade-down" data-aos-delay="150">

      <h2>Consulta tu pase</h2>

      <p class="texto">
        ESCRIBE TU NOMBRE COMO APARECE EN LA INVITACIÓN:
      </p>

      <input
        list="nombres"
        id="nombreInput"
        placeholder="Nombre/Familia"
        autocomplete="off"
        oninput="mostrarPases()"
      >

      <datalist id="nombres"></datalist>

      <div
        class="resultado"
        id="resultadoPases"
      ></div>

    </div>
  </div>
</section>



<!-- CONFIRMACIÓN DE ASISTENCIA -->
<section class="confirmar-asistencia">

  <h2>Confirmar Asistencia</h2>

  <p>
    ¿NOS PODRÁS ACOMPAÑAR EN ESTE DÍA TAN ESPECIAL?
  </p>

  <div class="opciones-asistencia">

    <button
      type="button"
      class="btn-asistencia"
      data-respuesta="Sí asistiré"
      onclick="seleccionarAsistencia(this)"
    >
      SÍ ASISTIRÉ
    </button>

    <button
      type="button"
      class="btn-asistencia"
      data-respuesta="No podré asistir"
      onclick="seleccionarAsistencia(this)"
    >
      NO PODRÉ ASISTIR
    </button>

  </div>
  
<p class="fecha-confirmacion">
    AGRADECEMOS TU CONFIRMACIÓN ANTES DEL <br><strong>4 DE ENERO DEL 2027</strong>
</p>

  <p>
    ¿QUIERES DEJARNOS UN MENSAJE U OBSERVACIÓN <br>SOBRE TU ASISTENCIA?
  </p>

  <textarea
    id="mensajeAsistencia"
    maxlength="500"
    placeholder="Escríbenos aquí..."
  ></textarea>

  <button
    type="button"
    id="botonEnviarAsistencia"
    onclick="enviarConfirmacion()"
  >
    ENVIAR
  </button>

  <p id="estadoEnvio"></p>

</section>


<!-- FORMULARIO OCULTO PARA GOOGLE SHEETS -->
<form
  id="formularioGoogle"
  method="POST"
  target="respuestaGoogle"
  style="display: none;"
>
  <input
    type="hidden"
    name="familia"
    id="googleFamilia"
  >

  <input
    type="hidden"
    name="pases"
    id="googlePases"
  >

  <input
    type="hidden"
    name="asistencia"
    id="googleAsistencia"
  >

  <input
    type="hidden"
    name="mensaje"
    id="googleMensaje"
  >
</form>

<iframe
  name="respuestaGoogle"
  id="respuestaGoogle"
  style="display: none;"
></iframe>

<script>
  /*
   * Pega aquí la URL que copiaste de Apps Script.
   * Debe terminar en /exec
   */
  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwU8nI8D2Yjonq_PmnxfUnoOpUIuCcDgFDXuThR5hCoCBNQEjtWxPg9gACCXmQVAr1oOw/exec";

  /*
   * Lista de invitados y recepciones.
   * Aquí debe estar la lista completa que preparamos.
   */
  const listaPases = {
"Tania Alejandra Valencia": 2,
  "Juan Carlos Vega": 1,
  "Manuel Alberto Rivera": 1,
  "Manuel Cárdenas": 1,
  "Jorge Isaís Plata": 1,
  "Raymundo Arvizu Moya": 1,
  "Héctor Castillo": 1,
  "Francisco Quintero Carrillo": 1,
  "Milton Aguirre": 1,
  "Fam. González Hernández": 2,
  "Fam. Carrillo González": 6,
  "Jocelyn Lara": 1,
  "Obed Alejandro Pérez": 2,
  "Fam. Carbajal Sarrelangue": 2,
  "Fam. Velasco Ludlow": 2,
  "Ana Fernanda Vásquez": 2,
  "Arnulfo López": 1,
  "Artemio Alcaraz": 1,
  "Oliverio Gómez": 1,
  "Abner Paniagua": 1,
  "Juan Carlos Ramírez": 1,
  "Alexander Espíndola": 1};

  let familiaSeleccionada = "";
  let pasesSeleccionados = 0;
  let asistenciaSeleccionada = "";
  let formularioEnviado = false;

  document.addEventListener(
    "DOMContentLoaded",
    cargarListaInvitados
  );

  function cargarListaInvitados() {
    const datalist = document.getElementById("nombres");

    if (!datalist) {
      console.error(
        'No se encontró el elemento con id="nombres".'
      );
      return;
    }

    datalist.innerHTML = "";

    Object.keys(listaPases).forEach(function(nombre) {
      const opcion = document.createElement("option");
      opcion.value = nombre;
      datalist.appendChild(opcion);
    });

    const formulario =
      document.getElementById("formularioGoogle");

    formulario.action = URL_APPS_SCRIPT;
  }

  function mostrarPases() {
    const campoNombre =
      document.getElementById("nombreInput");

    const resultado =
      document.getElementById("resultadoPases");

    const nombreEscrito = campoNombre.value.trim();

    const nombreCorrecto =
      encontrarNombreRegistrado(nombreEscrito);

    if (!nombreCorrecto) {
      familiaSeleccionada = "";
      pasesSeleccionados = 0;
      resultado.textContent = "";
      resultado.classList.remove("visible");
      return;
    }

    const cantidad = listaPases[nombreCorrecto];

    familiaSeleccionada = nombreCorrecto;
    pasesSeleccionados = cantidad || 0;

    if (
      cantidad === null ||
      cantidad === undefined ||
      cantidad === ""
    ) {
      resultado.textContent =
        "Tu nombre está registrado, pero la cantidad de pases está pendiente.";

      resultado.classList.add("visible");
      return;
    }

    const palabra =
      cantidad === 1
        ? "pase asignado"
        : "pases asignados";

    resultado.textContent =
      `¡Hola ${nombreCorrecto}! Tienes ${cantidad} ${palabra}.`;

    resultado.classList.add("visible");
  }

  function encontrarNombreRegistrado(nombreEscrito) {
    const nombreNormalizado =
      normalizarTexto(nombreEscrito);

    return Object.keys(listaPases).find(function(nombre) {
      return normalizarTexto(nombre) === nombreNormalizado;
    }) || "";
  }

  function normalizarTexto(texto) {
    return String(texto || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ");
  }

  function seleccionarAsistencia(boton) {
    asistenciaSeleccionada =
      boton.dataset.respuesta;

    document
      .querySelectorAll(".btn-asistencia")
      .forEach(function(elemento) {
        elemento.classList.remove("seleccionado");
      });

    boton.classList.add("seleccionado");

    const estado =
      document.getElementById("estadoEnvio");

    estado.textContent = "";
  }


  function enviarConfirmacion() {
    const estado =
      document.getElementById("estadoEnvio");

    const botonEnviar =
      document.getElementById(
        "botonEnviarAsistencia"
      );

    const mensaje =
      document.getElementById(
        "mensajeAsistencia"
      ).value.trim();

    /*
     * Volvemos a revisar el campo por si la persona
     * escribió el nombre sin seleccionar la sugerencia.
     */
    mostrarPases();

    if (!familiaSeleccionada) {
      estado.textContent =
        "Primero escribe y selecciona tu nombre o familia.";

      estado.className = "estado-envio error";
      return;
    }

    if (
      listaPases[familiaSeleccionada] === null ||
      listaPases[familiaSeleccionada] === undefined
    ) {
      estado.textContent =
        "La cantidad de pases de esta invitación todavía está pendiente.";

      estado.className = "estado-envio error";
      return;
    }

    if (!asistenciaSeleccionada) {
      estado.textContent =
        "Selecciona si podrás asistir.";

      estado.className = "estado-envio error";
      return;
    }

    if (mensaje.length > 500) {
      estado.textContent =
        "El mensaje no puede superar los 500 caracteres.";

      estado.className = "estado-envio error";
      return;
    }

    if (
      !URL_APPS_SCRIPT ||
      URL_APPS_SCRIPT.includes("PEGA_AQUI")
    ) {
      estado.textContent =
        "Falta colocar la URL de Apps Script.";

      estado.className = "estado-envio error";
      return;
    }

    document.getElementById(
      "googleFamilia"
    ).value = familiaSeleccionada;

    document.getElementById(
      "googlePases"
    ).value = pasesSeleccionados;

    document.getElementById(
      "googleAsistencia"
    ).value = asistenciaSeleccionada;

    document.getElementById(
      "googleMensaje"
    ).value = mensaje;

    formularioEnviado = true;
    botonEnviar.disabled = true;

    estado.textContent =
      "Enviando confirmación...";

    estado.className = "estado-envio";

    document
      .getElementById("formularioGoogle")
      .submit();

    /*
     * El iframe oculto termina de cargar
     * después de que Apps Script procesa el envío.
     */
    setTimeout(function() {
      estado.textContent =
        "¡Gracias! Tu confirmación fue registrada.";

      estado.className = "estado-envio exito";

      botonEnviar.textContent = "Confirmación enviada";

      document
        .querySelectorAll(".btn-asistencia")
        .forEach(function(elemento) {
          elemento.disabled = true;
        });

      document.getElementById(
        "mensajeAsistencia"
      ).disabled = true;

    }, 1800);
  }
</script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.umd.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="script.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const musica = document.getElementById("musicaFondo");
        musica.volume = 0.6;

        const reproducirMusica = () => {
          musica.play().catch(() => {
            console.log("Esperando interacción para reproducir.");
          });
        };

        reproducirMusica();

        document.addEventListener("click", reproducirMusica, { once: true });
        document.addEventListener("touchstart", reproducirMusica, { once: true });
      });
    </script>
  </body>
</html>
